kind = "web"
previewPath = "/"
title = "Capybara Deliveries"
description = "A 3D food delivery driving game starring a capybara rider, rebuilt for touchscreens while keeping desktop keyboard support."
version = "1.0.0"
id = "artifacts/capybara-delivery"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25764

[services.development]
run = "pnpm --filter @workspace/capybara-delivery run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/capybara-delivery", "run", "build" ]
serve = "static"
publicDir = "artifacts/capybara-delivery/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25764"
BASE_PATH = "/"
