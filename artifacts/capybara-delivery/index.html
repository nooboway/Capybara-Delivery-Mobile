    <script>
      // Choose a mobile-safe renderer tier before the game iframe is created.
      // Keep any tier the player has already selected in the game's settings.
      try {
        const isTouchDevice =
          window.matchMedia("(pointer: coarse)").matches ||
          window.matchMedia("(max-width: 760px)").matches ||
          navigator.maxTouchPoints > 0;
        if (
          isTouchDevice &&
          !window.localStorage.getItem("capy.settings.qualityTier")
        ) {
          window.localStorage.setItem("capy.settings.qualityTier", "low");
        }
      } catch {
        // Some privacy modes block local storage; the game has its own fallback.
      }
    </script>
